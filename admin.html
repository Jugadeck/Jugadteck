<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - JugadTeck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class' }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .logo-circle { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; border: 3px solid white; background: white; cursor: pointer; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 min-h-screen transition-colors duration-300">

    <div id="loginScreen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-md">
            <div class="text-center mb-8">
                <div class="logo-circle mx-auto mb-4 bg-blue-900 flex items-center justify-center">
                    <img src="logo.png" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\'text-2xl font-bold text-blue-900\'>JT</span>'">
                </div>
                <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Admin Login</h2>
            </div>
            <input type="password" id="adminPassword" placeholder="Enter Password" class="w-full px-4 py-3 border-2 border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg mb-4 outline-none">
            <button onclick="login()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">Login</button>
        </div>
    </div>

    <div id="adminDashboard" class="hidden">
        <header class="bg-blue-900 dark:bg-gray-800 text-white shadow-lg">
            <div class="container mx-auto px-4 py-4 flex justify-between items-center">
                <!-- Logo Click navigates to Product Form -->
                <div class="flex items-center gap-3 cursor-pointer" onclick="document.getElementById('productForm').scrollIntoView({behavior: 'smooth'})">
                    <div class="logo-circle bg-white flex items-center justify-center">
                        <img src="logo.png" class="w-full h-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\'text-xl font-bold text-blue-900\'>JT</span>'">
                    </div>
                    <div>
                        <h1 class="text-xl font-bold">Admin Dashboard</h1>
                        <p class="text-xs text-blue-200">Click logo to add products</p>
                    </div>
                </div>
                <div class="flex gap-3">
                    <a href="index.html" target="_blank" class="bg-blue-700 px-4 py-2 rounded-lg hover:bg-blue-600 text-sm"><i class="fas fa-external-link-alt mr-2"></i>View Site</a>
                    <button onclick="logout()" class="bg-red-600 px-4 py-2 rounded-lg hover:bg-red-500 text-sm"><i class="fas fa-sign-out-alt mr-2"></i>Logout</button>
                </div>
            </div>
        </header>

        <div class="container mx-auto px-4 py-8">
            <div class="grid lg:grid-cols-2 gap-8">
                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
                    <h2 class="text-2xl font-bold mb-6 text-gray-800 dark:text-white" id="formTitle"><i class="fas fa-plus-circle text-blue-600 mr-2"></i>Add New Product</h2>
                    <form id="productForm" class="space-y-4">
                        <input type="hidden" id="productId">
                        <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Product ID</label><input type="number" id="pId" required class="w-full px-4 py-2 border-2 border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg outline-none"></div>
                        <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Product Name</label><input type="text" id="pName" required class="w-full px-4 py-2 border-2 border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg outline-none"></div>
                        <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Category</label>
                            <select id="pCategory" required class="w-full px-4 py-2 border-2 border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg outline-none">
                                <option value="">Select</option><option value="Arduino">Arduino</option><option value="ESP32">ESP32</option><option value="Sensors">Sensors</option>
                                <option value="Modules">Modules</option><option value="Raspberry Pi">Raspberry Pi</option><option value="Project Kit">Project Kit</option><option value="Projects">Projects</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Price (₹)</label><input type="number" id="pPrice" required class="w-full px-4 py-2 border-2 border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg outline-none"></div>
                            <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Original Price</label><input type="number" id="pOriginalPrice" class="w-full px-4 py-2 border-2 border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg outline-none"></div>
                        </div>
                        <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Image URLs (Comma separated)</label><textarea id="pImages" required rows="2" class="w-full px-4 py-2 border-2 border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg outline-none font-mono text-sm"></textarea><div id="imagePreviewContainer" class="flex gap-2 mt-2 overflow-x-auto"></div></div>
                        <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Description</label><textarea id="pDescription" required rows="2" class="w-full px-4 py-2 border-2 border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg outline-none"></textarea></div>
                        <div><label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Specifications</label><textarea id="pSpecifications" rows="4" class="w-full px-4 py-2 border-2 border-gray-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg outline-none font-mono text-sm"></textarea></div>
                        <div class="flex gap-3 pt-4">
                            <button type="submit" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700"><i class="fas fa-save mr-2"></i>Save</button>
                            <button type="button" onclick="resetForm()" class="px-6 bg-gray-300 dark:bg-gray-600 text-gray-700 dark:text-white py-3 rounded-lg font-bold"><i class="fas fa-undo"></i></button>
                        </div>
                    </form>
                </div>

                <div class="bg-white dark:bg-gray-800 rounded-xl shadow-lg p-6">
                    <h2 class="text-2xl font-bold mb-6 text-gray-800 dark:text-white"><i class="fas fa-list text-blue-600 mr-2"></i>Products</h2>
                    <div id="productsList" class="space-y-3 max-h-[600px] overflow-y-auto pr-2"></div>
                </div>
            </div>

            <div class="mt-8 bg-yellow-50 dark:bg-yellow-900/20 border-2 border-yellow-300 dark:border-yellow-700 rounded-xl p-6">
                <h3 class="text-xl font-bold text-yellow-800 dark:text-yellow-400 mb-4"><i class="fas fa-info-circle mr-2"></i>Update Website</h3>
                <button onclick="generateCode()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 text-lg"><i class="fas fa-code mr-2"></i>Generate Code & Copy</button>
                <textarea id="generatedCode" readonly class="mt-4 w-full h-40 p-4 bg-gray-800 text-green-400 font-mono text-xs rounded-lg hidden"></textarea>
            </div>
        </div>
    </div>

    <script>
        let adminProducts = JSON.parse(localStorage.getItem('jugadteck_admin_products')) || [];
        let adminPassword = 'singh@12345678';

        function login() { if (document.getElementById('adminPassword').value === adminPassword) { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('adminDashboard').classList.remove('hidden'); renderProductsList(); } else alert('Wrong password!'); }
        function logout() { location.reload(); }

        document.getElementById('productForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const id = parseInt(document.getElementById('pId').value);
            const idx = adminProducts.findIndex(p => p.id === id);
            const product = {
                id, name: document.getElementById('pName').value, category: document.getElementById('pCategory').value,
                price: parseFloat(document.getElementById('pPrice').value), originalPrice: parseFloat(document.getElementById('pOriginalPrice').value) || null,
                discount: document.getElementById('pOriginalPrice').value ? true : false,
                images: document.getElementById('pImages').value.split(',').map(u => u.trim()).filter(u => u),
                description: document.getElementById('pDescription').value, specifications: document.getElementById('pSpecifications').value
            };
            if (idx !== -1) adminProducts[idx] = product; else adminProducts.push(product);
            localStorage.setItem('jugadteck_admin_products', JSON.stringify(adminProducts));
            resetForm(); renderProductsList(); alert('Product Saved!');
        });

        document.getElementById('pImages').addEventListener('input', function() {
            document.getElementById('imagePreviewContainer').innerHTML = this.value.split(',').map(u => u.trim()).filter(u => u).map(url => `<img src="${url}" class="h-16 w-16 object-cover rounded border dark:border-gray-600">`).join('');
        });

        function renderProductsList() {
            document.getElementById('productsList').innerHTML = adminProducts.map(p => `
                <div class="flex items-center gap-4 p-4 bg-gray-50 dark:bg-gray-700 rounded-lg border dark:border-gray-600">
                    <img src="${p.images ? p.images[0] : ''}" class="w-16 h-16 object-cover rounded border dark:border-gray-600">
                    <div class="flex-1 min-w-0"><h4 class="font-bold text-gray-800 dark:text-white truncate">${p.name}</h4><p class="text-sm text-gray-500 dark:text-gray-400">${p.category} - ₹${p.price}</p></div>
                    <div class="flex gap-2"><button onclick="editProduct(${p.id})" class="bg-blue-500 text-white w-8 h-8 rounded flex items-center justify-center"><i class="fas fa-edit text-xs"></i></button><button onclick="deleteProduct(${p.id})" class="bg-red-500 text-white w-8 h-8 rounded flex items-center justify-center"><i class="fas fa-trash text-xs"></i></button></div>
                </div>`).join('');
        }

        function editProduct(id) {
            const p = adminProducts.find(x => x.id === id);
            document.getElementById('pId').value = p.id; document.getElementById('pName').value = p.name; document.getElementById('pCategory').value = p.category;
            document.getElementById('pPrice').value = p.price; document.getElementById('pOriginalPrice').value = p.originalPrice || '';
            document.getElementById('pImages').value = p.images ? p.images.join(', ') : ''; document.getElementById('pDescription').value = p.description; document.getElementById('pSpecifications').value = p.specifications || '';
            document.getElementById('pImages').dispatchEvent(new Event('input'));
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit text-blue-600 mr-2"></i>Edit Product';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteProduct(id) { if(confirm('Delete?')) { adminProducts = adminProducts.filter(p => p.id !== id); localStorage.setItem('jugadteck_admin_products', JSON.stringify(adminProducts)); renderProductsList(); } }
        function resetForm() { document.getElementById('productForm').reset(); document.getElementById('productId').value = ''; document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle text-blue-600 mr-2"></i>Add New Product'; document.getElementById('imagePreviewContainer').innerHTML = ''; }
        
        function generateCode() {
            const code = `const PRODUCTS = ${JSON.stringify(adminProducts, null, 4)};`;
            const ta = document.getElementById('generatedCode'); ta.value = code; ta.classList.remove('hidden'); ta.select(); document.execCommand('copy');
            alert('Code copied! Go to GitHub -> products.js -> Edit -> Paste -> Commit changes.');
        }
        document.getElementById('adminPassword').addEventListener('keypress', e => { if (e.key === 'Enter') login(); });
    </script>
</body>
</html>
