<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JugadTeck - 3D Electronics Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', theme: { extend: { colors: { primary: '#1e40af', neon: '#00f3ff' } } } }</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 3D Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap');
        
        body { font-family: 'Rajdhani', sans-serif; overflow-x: hidden; background: #050510; color: white; }
        h1, h2, h3, .brand-font { font-family: 'Orbitron', sans-serif; }
        
        /* 3D Background Canvas */
        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; }
        
        /* Glassmorphism */
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        .glass-dark { background: rgba(10, 10, 25, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(0, 243, 255, 0.2); }
        
        /* 3D Card Styles */
        .product-card-3d { transform-style: preserve-3d; transform: perspective(1000px); }
        .product-card-3d .card-content { transform: translateZ(20px); }
        .product-card-3d .card-img { transform: translateZ(30px); transition: transform 0.3s; }
        .product-card-3d:hover .card-img { transform: translateZ(50px) scale(1.05); }
        
        /* Neon Glows */
        .neon-text { text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff; }
        .neon-border { box-shadow: 0 0 10px #00f3ff, inset 0 0 10px #00f3ff; }
        
        /* Cart & Modal */
        .cart-sidebar { transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .cart-sidebar.open { transform: translateX(0); }
        #productDetailsModal { display: none; opacity: 0; transition: opacity 0.3s; }
        #productDetailsModal.active { display: block; opacity: 1; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #050510; }
        ::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 4px; }
        
        .tab-btn.active { color: #00f3ff; border-bottom: 2px solid #00f3ff; text-shadow: 0 0 8px #00f3ff; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">

    <!-- 3D Background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Header -->
    <header class="glass sticky top-0 z-40 border-b border-cyan-500/30">
        <div class="container mx-auto px-4 py-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="document.getElementById('products').scrollIntoView({behavior: 'smooth'})">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/50">
                        <img src="logo.png" class="w-10 h-10 rounded-full object-cover" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\'text-xl font-bold text-white brand-font\'>JT</span>'">
                    </div>
                    <div class="hidden md:block">
                        <h1 class="text-2xl font-bold text-white neon-text brand-font">JUGADTECK</h1>
                        <p class="text-xs text-cyan-300">From Concept to Circuit</p>
                    </div>
                </div>
                <div class="flex-1 max-w-xl mx-8 hidden md:block">
                    <div class="relative">
                        <input type="text" id="searchInput" placeholder="Search 3D components..." class="w-full pl-12 pr-4 py-2 rounded-full bg-white/10 border border-cyan-500/30 text-white focus:border-cyan-400 focus:shadow-[0_0_15px_#00f3ff] outline-none transition">
                        <i class="fas fa-search absolute left-4 top-3 text-cyan-400"></i>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <a href="admin.html" class="text-cyan-400 hover:text-white transition text-xl"><i class="fas fa-user-shield"></i></a>
                    <button onclick="toggleCart()" class="relative bg-gradient-to-r from-cyan-500 to-blue-600 text-white px-5 py-2 rounded-full hover:shadow-[0_0_20px_#00f3ff] transition font-bold">
                        <i class="fas fa-shopping-cart mr-2"></i><span class="hidden md:inline">Cart</span>
                        <span id="cartCount" class="absolute -top-2 -right-2 bg-red-500 text-white text-xs rounded-full h-6 w-6 flex items-center justify-center font-bold border-2 border-gray-900">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Hero -->
    <section class="relative py-20 md:py-32 overflow-hidden">
        <div class="container mx-auto px-4 text-center relative z-10">
            <h2 class="text-5xl md:text-7xl font-bold mb-6 text-white neon-text brand-font">NEXT-GEN ELECTRONICS</h2>
            <p class="text-xl md:text-2xl mb-10 text-cyan-200 max-w-3xl mx-auto">Explore Arduino, ESP32, Raspberry Pi & IoT in an immersive 3D experience.</p>
            <button onclick="document.getElementById('products').scrollIntoView({behavior: 'smooth'})" class="bg-cyan-500 text-gray-900 px-10 py-4 rounded-full font-bold text-lg hover:bg-cyan-400 hover:shadow-[0_0_30px_#00f3ff] transition transform hover:scale-105 brand-font">
                ENTER STORE <i class="fas fa-rocket ml-2"></i>
            </button>
        </div>
    </section>

    <!-- Products -->
    <section id="products" class="container mx-auto px-4 py-12 relative z-10">
        <h2 class="text-4xl font-bold text-center mb-10 text-white neon-text brand-font">HOLOGRAPHIC INVENTORY</h2>
        <div class="flex flex-wrap justify-center gap-3 mb-10" id="categoryFilters">
            <button onclick="filterProducts('all')" class="filter-btn active px-6 py-2 rounded-full glass text-cyan-300 hover:text-white hover:bg-cyan-500/20 transition font-bold">All</button>
            <button onclick="filterProducts('Arduino')" class="filter-btn px-6 py-2 rounded-full glass text-cyan-300 hover:text-white hover:bg-cyan-500/20 transition font-bold">Arduino</button>
            <button onclick="filterProducts('ESP32')" class="filter-btn px-6 py-2 rounded-full glass text-cyan-300 hover:text-white hover:bg-cyan-500/20 transition font-bold">ESP32</button>
            <button onclick="filterProducts('Sensors')" class="filter-btn px-6 py-2 rounded-full glass text-cyan-300 hover:text-white hover:bg-cyan-500/20 transition font-bold">Sensors</button>
            <button onclick="filterProducts('Modules')" class="filter-btn px-6 py-2 rounded-full glass text-cyan-300 hover:text-white hover:bg-cyan-500/20 transition font-bold">Modules</button>
            <button onclick="filterProducts('Project Kit')" class="filter-btn px-6 py-2 rounded-full glass text-cyan-300 hover:text-white hover:bg-cyan-500/20 transition font-bold">Project Kit</button>
            <button onclick="filterProducts('Projects')" class="filter-btn px-6 py-2 rounded-full glass text-cyan-300 hover:text-white hover:bg-cyan-500/20 transition font-bold">Projects</button>
        </div>
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    </section>

    <!-- PRODUCT DETAILS MODAL (3D) -->
    <div id="productDetailsModal" class="fixed inset-0 z-50 overflow-y-auto flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
        <div class="glass-dark rounded-2xl w-full max-w-6xl max-h-[90vh] overflow-y-auto relative border border-cyan-500/30 shadow-[0_0_50px_rgba(0,243,255,0.2)]">
            <button onclick="closeProductDetails()" class="absolute top-4 right-4 text-white hover:text-cyan-400 text-2xl z-20 bg-black/50 rounded-full w-10 h-10 flex items-center justify-center"><i class="fas fa-times"></i></button>
            
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8 p-6 md:p-10">
                <!-- Image -->
                <div class="relative bg-gradient-to-br from-gray-800 to-black rounded-xl p-4 flex items-center justify-center border border-cyan-500/20" id="tiltImageContainer">
                    <img id="detailImage" src="" alt="Product" class="max-h-[400px] w-auto object-contain drop-shadow-[0_0_15px_rgba(0,243,255,0.5)]">
                    <div class="absolute bottom-4 left-4 flex gap-2" id="thumbnailContainer"></div>
                </div>

                <!-- Info -->
                <div class="space-y-6">
                    <div>
                        <span id="detailCategory" class="text-cyan-400 text-sm font-bold tracking-widest uppercase"></span>
                        <h1 id="detailTitle" class="text-3xl md:text-4xl font-bold text-white mt-2 brand-font"></h1>
                        <div class="flex items-center gap-3 mt-3">
                            <span id="detailStockStatus" class="text-sm font-bold text-green-400"><i class="fas fa-check-circle mr-1"></i>In Stock</span>
                        </div>
                    </div>
                    
                    <div class="glass p-4 rounded-xl border border-cyan-500/20">
                        <p class="text-xs text-gray-400 mb-1">CURRENT PRICE</p>
                        <div class="flex items-baseline gap-3">
                            <span class="text-4xl font-bold text-cyan-400 neon-text" id="detailPrice"></span>
                            <span class="text-lg text-gray-500 line-through hidden" id="detailOriginalPrice"></span>
                            <span class="text-sm text-green-400 font-bold hidden" id="detailDiscount"></span>
                        </div>
                    </div>

                    <div class="flex gap-4">
                        <button id="btnBuyNow" onclick="buyNowWhatsApp()" class="flex-1 bg-gradient-to-r from-green-500 to-emerald-600 text-white py-3 rounded-xl font-bold hover:shadow-[0_0_20px_#10b981] transition flex items-center justify-center gap-2"><i class="fab fa-whatsapp text-xl"></i> BUY NOW</button>
                        <button id="btnAddCart" onclick="addToCartFromDetails()" class="flex-1 bg-gradient-to-r from-cyan-500 to-blue-600 text-white py-3 rounded-xl font-bold hover:shadow-[0_0_20px_#00f3ff] transition flex items-center justify-center gap-2"><i class="fas fa-cart-plus"></i> ADD TO CART</button>
                    </div>

                    <!-- Tabs -->
                    <div class="border-b border-gray-700 flex gap-6">
                        <button class="tab-btn active pb-2" onclick="switchTab('description', this)">Description</button>
                        <button class="tab-btn pb-2 text-gray-400" onclick="switchTab('specifications', this)">Specs</button>
                    </div>
                    <div class="tab-content active max-h-60 overflow-y-auto pr-2" id="tab-description"><p id="detailDescription" class="text-gray-300 leading-relaxed"></p></div>
                    <div class="tab-content hidden max-h-60 overflow-y-auto pr-2" id="tab-specifications"><div id="detailSpecifications" class="text-sm text-gray-300"></div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Cart Sidebar -->
    <div id="cartSidebar" class="cart-sidebar fixed top-0 right-0 h-full w-full md:w-[450px] glass-dark shadow-2xl z-[60] flex flex-col border-l border-cyan-500/30">
        <div class="p-5 border-b border-cyan-500/30 flex justify-between items-center bg-black/40">
            <h3 class="text-xl font-bold text-cyan-400 brand-font"><i class="fas fa-shopping-cart mr-2"></i>HOLO-CART</h3>
            <button onclick="toggleCart(false)" class="text-white hover:text-cyan-400 text-2xl"><i class="fas fa-times"></i></button>
        </div>
        <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
        <div class="p-5 border-t border-cyan-500/30 bg-black/60">
            <div class="flex justify-between mb-2 text-sm"><span class="text-gray-400">Subtotal:</span><span id="cartSubtotal" class="font-bold text-white">0</span></div>
            <div class="flex justify-between mb-4 text-sm"><span class="text-gray-400">Delivery:</span><span id="cartDeliveryCharge" class="font-bold text-red-400">40</span></div>
            <div class="flex justify-between mb-6 text-xl border-t border-gray-700 pt-3"><span class="font-bold text-white brand-font">TOTAL:</span><span id="cartTotal" class="font-bold text-cyan-400 neon-text">0</span></div>
            <button onclick="checkoutWhatsApp()" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white py-3 rounded-xl font-bold hover:shadow-[0_0_20px_#10b981] transition flex items-center justify-center gap-2 text-lg"><i class="fab fa-whatsapp text-2xl"></i> CHECKOUT</button>
        </div>
    </div>

    <script src="products.js"></script>
    <script>
        // --- 3D BACKGROUND (Three.js) ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);

        // Particles
        const particlesGeometry = new THREE.BufferGeometry();
        const particlesCount = 1500;
        const posArray = new Float32Array(particlesCount * 3);
        for(let i = 0; i < particlesCount * 3; i++) { posArray[i] = (Math.random() - 0.5) * 15; }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particlesMaterial = new THREE.PointsMaterial({ size: 0.02, color: 0x00f3ff, transparent: true, opacity: 0.8 });
        const particlesMesh = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particlesMesh);

        // Floating Shapes (Chips)
        const shapes = [];
        const geometries = [new THREE.IcosahedronGeometry(0.5, 0), new THREE.TorusGeometry(0.4, 0.15, 16, 100), new THREE.OctahedronGeometry(0.5)];
        const material = new THREE.MeshBasicMaterial({ color: 0x1e40af, wireframe: true, transparent: true, opacity: 0.3 });
        
        for(let i=0; i<15; i++) {
            const mesh = new THREE.Mesh(geometries[i % 3], material);
            mesh.position.set((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
            mesh.rotation.x = Math.random() * Math.PI;
            mesh.rotation.y = Math.random() * Math.PI;
            scene.add(mesh);
            shapes.push({ mesh, speedX: (Math.random() - 0.5) * 0.01, speedY: (Math.random() - 0.5) * 0.01 });
        }

        camera.position.z = 3;

        let mouseX = 0; let mouseY = 0;
        document.addEventListener('mousemove', (event) => {
            mouseX = event.clientX / window.innerWidth - 0.5;
            mouseY = event.clientY / window.innerHeight - 0.5;
        });

        function animate() {
            requestAnimationFrame(animate);
            particlesMesh.rotation.y += 0.001;
            particlesMesh.rotation.x += 0.0005;
            
            shapes.forEach(s => {
                s.mesh.rotation.x += s.speedX;
                s.mesh.rotation.y += s.speedY;
            });

            camera.position.x += (mouseX * 2 - camera.position.x) * 0.05;
            camera.position.y += (-mouseY * 2 - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

        // --- APP LOGIC ---
        let cart = JSON.parse(localStorage.getItem('jugadteck_cart')) || [];
        let wishlist = JSON.parse(localStorage.getItem('jugadteck_wishlist')) || [];
        let currentProduct = null;

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { renderProducts(PRODUCTS); updateCartUI(); }, 500);
            document.getElementById('searchInput').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                renderProducts(PRODUCTS.filter(p => p.name.toLowerCase().includes(term) || p.category.toLowerCase().includes(term)));
            });
        });

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = products.map((p, i) => {
                const isOutOfStock = p.quantity === 0;
                const isLowStock = p.quantity > 0 && p.quantity <= 2;
                return `
                <div class="product-card-3d glass rounded-2xl overflow-hidden relative group cursor-pointer" data-tilt data-tilt-max="15" data-tilt-speed="400" data-tilt-glare data-tilt-max-glare="0.2" style="animation-delay: ${i * 0.05}s" onclick="${isOutOfStock ? '' : `openProductDetails(${p.id})`}">
                    ${isOutOfStock ? '<div class="absolute top-3 left-3 z-20 bg-red-600 text-white px-3 py-1 rounded-full text-xs font-bold shadow-lg">OUT OF STOCK</div>' : ''}
                    ${p.discount && !isOutOfStock ? '<div class="absolute top-3 left-3 z-20 bg-cyan-500 text-gray-900 px-3 py-1 rounded-full text-xs font-bold shadow-[0_0_10px_#00f3ff]">SALE</div>' : ''}
                    
                    <div class="relative h-56 bg-gradient-to-br from-gray-800 to-black flex items-center justify-center p-4 overflow-hidden card-img">
                        <img src="${p.images ? p.images[0] : p.image}" class="w-full h-full object-contain drop-shadow-[0_0_10px_rgba(255,255,255,0.3)]">
                    </div>
                    
                    <div class="p-5 card-content">
                        <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider">${p.category}</span>
                        <h3 class="font-bold text-lg mt-2 mb-3 text-white line-clamp-2">${p.name}</h3>
                        
                        <div class="flex items-baseline gap-2 mb-4">
                            <span class="text-2xl font-bold text-cyan-400 neon-text">₹${p.price}</span>
                            ${p.originalPrice && p.originalPrice > p.price ? `<span class="text-sm text-gray-500 line-through">₹${p.originalPrice}</span>` : ''}
                        </div>
                        ${isLowStock ? '<p class="text-xs text-orange-400 font-bold mb-3"><i class="fas fa-fire mr-1"></i>Only ${p.quantity} left!</p>' : ''}

                        <button onclick="event.stopPropagation(); addToCart(${p.id})" class="w-full ${isOutOfStock ? 'bg-gray-700 text-gray-500 cursor-not-allowed' : 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white hover:shadow-[0_0_15px_#00f3ff]'} py-2 rounded-lg font-bold transition text-sm" ${isOutOfStock ? 'disabled' : ''}>
                            <i class="fas fa-cart-plus mr-1"></i> ${isOutOfStock ? 'SOLD OUT' : 'ADD TO CART'}
                        </button>
                    </div>
                </div>`;
            }).join('');
            
            // Re-init Tilt
            VanillaTilt.init(document.querySelectorAll(".product-card-3d"), { max: 15, speed: 400, glare: true, "max-glare": 0.2 });
        }

        function openProductDetails(id) {
            currentProduct = PRODUCTS.find(p => p.id === id);
            if (!currentProduct || currentProduct.quantity === 0) return;
            
            const images = currentProduct.images || [currentProduct.image];
            document.getElementById('detailImage').src = images[0];
            document.getElementById('detailCategory').textContent = currentProduct.category;
            document.getElementById('detailTitle').textContent = currentProduct.name;
            document.getElementById('detailPrice').textContent = `₹${currentProduct.price}`;
            document.getElementById('detailDescription').textContent = currentProduct.description;
            
            const stockEl = document.getElementById('detailStockStatus');
            const btnBuy = document.getElementById('btnBuyNow');
            const btnCart = document.getElementById('btnAddCart');
            
            if (currentProduct.quantity === 0) {
                stockEl.innerHTML = '<i class="fas fa-times-circle mr-1"></i>Out of Stock'; stockEl.className = 'text-sm font-bold text-red-500';
                btnBuy.disabled = true; btnCart.disabled = true; btnBuy.classList.add('opacity-50'); btnCart.classList.add('opacity-50');
            } else if (currentProduct.quantity <= 2) {
                stockEl.innerHTML = `<i class="fas fa-fire mr-1"></i>Only ${currentProduct.quantity} left!`; stockEl.className = 'text-sm font-bold text-orange-400';
                btnBuy.disabled = false; btnCart.disabled = false; btnBuy.classList.remove('opacity-50'); btnCart.classList.remove('opacity-50');
            } else {
                stockEl.innerHTML = '<i class="fas fa-check-circle mr-1"></i>In Stock'; stockEl.className = 'text-sm font-bold text-green-400';
                btnBuy.disabled = false; btnCart.disabled = false; btnBuy.classList.remove('opacity-50'); btnCart.classList.remove('opacity-50');
            }

            const origEl = document.getElementById('detailOriginalPrice'), discEl = document.getElementById('detailDiscount');
            if (currentProduct.originalPrice && currentProduct.originalPrice > currentProduct.price) {
                origEl.textContent = `₹${currentProduct.originalPrice}`; origEl.classList.remove('hidden');
                discEl.textContent = `${Math.round(((currentProduct.originalPrice - currentProduct.price) / currentProduct.originalPrice) * 100)}% off`; discEl.classList.remove('hidden');
            } else { origEl.classList.add('hidden'); discEl.classList.add('hidden'); }

            const specsEl = document.getElementById('detailSpecifications');
            if (currentProduct.specifications) {
                specsEl.innerHTML = '<div class="space-y-2">' + currentProduct.specifications.split('\n').filter(s=>s.trim()).map(spec => {
                    const parts = spec.split(':');
                    return parts.length >= 2 ? `<div class="flex border-b border-gray-700 py-2"><span class="w-1/3 text-cyan-400 font-bold">${parts[0].replace('•','').trim()}</span><span class="w-2/3 text-gray-300">${parts.slice(1).join(':').trim()}</span></div>` : `<div class="py-2 text-gray-300">${spec}</div>`;
                }).join('') + '</div>';
            }

            document.getElementById('thumbnailContainer').innerHTML = images.map((img, idx) => `<img src="${img}" class="w-12 h-12 object-cover rounded border-2 border-cyan-500/30 cursor-pointer hover:border-cyan-400" onclick="document.getElementById('detailImage').src='${img}'">`).join('');

            // 3D Tilt for Modal Image
            VanillaTilt.init(document.getElementById("tiltImageContainer"), { max: 10, speed: 400, glare: true, "max-glare": 0.3 });

            document.getElementById('productDetailsModal').classList.add('active');
            switchTab('description', document.querySelector('.tab-btn'));
        }

        function closeProductDetails() { document.getElementById('productDetailsModal').classList.remove('active'); currentProduct = null; }
        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => { b.classList.remove('active'); b.classList.add('text-gray-400'); });
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            btn.classList.add('active'); btn.classList.remove('text-gray-400');
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
        }

        function addToCart(id) {
            const p = PRODUCTS.find(x => x.id === id);
            if (!p || p.quantity === 0) return;
            const existing = cart.find(x => x.id === id);
            if (existing) { if(existing.quantity < p.quantity) existing.quantity++; } 
            else cart.push({ id: p.id, name: p.name, price: p.price, image: p.images ? p.images[0] : p.image, quantity: 1 });
            saveCart();
        }

        function removeFromCart(id) { cart = cart.filter(x => x.id !== id); saveCart(); }
        function updateQty(id, change) {
            const item = cart.find(x => x.id === id);
            const p = PRODUCTS.find(x => x.id === id);
            if (item) { item.quantity += change; if (item.quantity <= 0) removeFromCart(id); else if (p && item.quantity > p.quantity) item.quantity = p.quantity; saveCart(); }
        }
        function saveCart() { localStorage.setItem('jugadteck_cart', JSON.stringify(cart)); updateCartUI(); }

        function updateCartUI() {
            const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            const isFree = total >= 1000 || count >= 8;
            const charge = isFree ? 0 : 40;

            document.getElementById('cartCount').textContent = count;
            document.getElementById('cartSubtotal').textContent = `₹${total}`;
            document.getElementById('cartTotal').textContent = `₹${total + charge}`;
            document.getElementById('cartDeliveryCharge').textContent = charge === 0 ? 'FREE' : `₹${charge}`;
            document.getElementById('cartDeliveryCharge').className = `font-bold ${charge === 0 ? 'text-green-400' : 'text-red-400'}`;

            const itemsEl = document.getElementById('cartItems');
            if (cart.length === 0) itemsEl.innerHTML = '<div class="text-center text-gray-500 mt-20"><i class="fas fa-shopping-basket text-6xl mb-4 text-cyan-500/30"></i><p class="text-lg">Cart is Empty</p></div>';
            else itemsEl.innerHTML = cart.map(item => `
                <div class="flex gap-4 glass p-3 rounded-xl border border-cyan-500/10">
                    <img src="${item.image}" class="w-16 h-16 object-cover rounded bg-black">
                    <div class="flex-1">
                        <h4 class="font-bold text-white text-sm">${item.name}</h4>
                        <p class="text-cyan-400 font-bold">₹${item.price}</p>
                        <div class="flex items-center gap-3 mt-2">
                            <button onclick="updateQty(${item.id}, -1)" class="w-6 h-6 rounded bg-gray-700 hover:bg-cyan-600 flex items-center justify-center text-xs"><i class="fas fa-minus"></i></button>
                            <span class="font-bold w-6 text-center text-white">${item.quantity}</span>
                            <button onclick="updateQty(${item.id}, 1)" class="w-6 h-6 rounded bg-gray-700 hover:bg-cyan-600 flex items-center justify-center text-xs"><i class="fas fa-plus"></i></button>
                            <button onclick="removeFromCart(${item.id})" class="ml-auto text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function toggleCart(forceState) {
            const s = document.getElementById('cartSidebar');
            if (forceState === true) s.classList.add('open'); 
            else if (forceState === false) s.classList.remove('open'); 
            else s.classList.toggle('open');
        }
        
        function addToCartFromDetails() { if (currentProduct && currentProduct.quantity > 0) { addToCart(currentProduct.id); toggleCart(true); } }
        function buyNowWhatsApp() {
            if (!currentProduct) return;
            const msg = `*NEW ORDER*%0A%0A*Product:* ${currentProduct.name}%0A*Price:* ₹${currentProduct.price}%0A%0APlease confirm.`;
            window.open(`https://wa.me/919140781523?text=${msg}`, '_blank');
        }
        function checkoutWhatsApp() {
            if (cart.length === 0) return alert('Cart is empty!');
            const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            const charge = (total >= 1000 || count >= 8) ? 0 : 40;
            let msg = `*NEW ORDER - JugadTeck*%0A%0A`;
            cart.forEach((item, i) => { msg += `${i+1}. *${item.name}* (Qty: ${item.quantity}) - ₹${item.price * item.quantity}%0A`; });
            msg += `%0A*Subtotal:* ₹${total}%0A*Delivery:* ${charge === 0 ? 'FREE' : '₹'+charge}%0A*TOTAL:* ₹${total + charge}%0A%0APlease confirm.`;
            window.open(`https://wa.me/919140781523?text=${msg}`, '_blank');
        }
        function filterProducts(cat) {
            document.querySelectorAll('.filter-btn').forEach(b => { b.classList.remove('bg-cyan-500/20', 'text-white'); b.classList.add('text-cyan-300'); });
            event.target.classList.remove('text-cyan-300'); event.target.classList.add('bg-cyan-500/20', 'text-white');
            renderProducts(cat === 'all' ? PRODUCTS : PRODUCTS.filter(p => p.category === cat));
        }
    </script>
</body>
</html>
